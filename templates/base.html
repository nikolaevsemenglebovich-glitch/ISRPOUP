<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or 'Сервисный центр' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('requests_list') }}">Repair Center</a>
        {% if session.get('user_id') %}
        <div class="navbar-nav ms-auto d-flex flex-row gap-2 align-items-center">
            <a class="nav-link text-white" href="{{ url_for('requests_list') }}">Заявки</a>
            <a class="nav-link text-white" href="{{ url_for('stats') }}">Статистика</a>
            <span class="badge bg-primary">{{ current_role }}</span>
            <span class="text-white small">{{ current_fio }}</span>
            <a class="btn btn-sm btn-outline-light" href="{{ url_for('logout') }}">Выйти</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container py-4">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
